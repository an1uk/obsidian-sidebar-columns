name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
          cache: false
      - name: Verify release metadata
        run: node scripts/release-preflight.mjs --metadata-only
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check types
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build and package
        run: pnpm package
      - name: Verify distribution allowlist and checksums
        run: node scripts/release-preflight.mjs
      - name: Retain build files and installable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidebar-columns-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            main.js
            manifest.json
            styles.css
            dist/sidebar-columns-*.zip
            dist/checksums.json
          if-no-files-found: error
          retention-days: 30
