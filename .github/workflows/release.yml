name: Prepare attested release
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG_VERSION: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
          cache: false
      - name: Verify tag and default-branch metadata
        run: |
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          node scripts/release-preflight.mjs --tag "$TAG_VERSION" --default-ref "refs/remotes/origin/$DEFAULT_BRANCH" --metadata-only
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/releases/tags/$TAG_VERSION" > "$RUNNER_TEMP/existing-release.json" 2> "$RUNNER_TEMP/release-lookup-error.txt"; then
            echo "A release already exists for this tag. Existing drafts and published assets are never replaced automatically." >&2
            exit 1
          fi
          if ! grep -q '(HTTP 404)' "$RUNNER_TEMP/release-lookup-error.txt"; then
            cat "$RUNNER_TEMP/release-lookup-error.txt" >&2
            exit 1
          fi
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check types
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build and package
        run: pnpm package
      - name: Recheck default branch and distribution
        run: |
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          node scripts/release-preflight.mjs --tag "$TAG_VERSION" --default-ref "refs/remotes/origin/$DEFAULT_BRANCH"
      - name: Attest the exact Obsidian release assets
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
          create-storage-record: false
      - name: Keep the attestation bundle with developer artifacts
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" dist/attestation.json
      - name: Retain build files, installable ZIP, checksums and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidebar-columns-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            main.js
            manifest.json
            styles.css
            dist/sidebar-columns-*.zip
            dist/checksums.json
            dist/attestation.json
          if-no-files-found: error
          retention-days: 90
      - name: Create a draft with only the supported Obsidian assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s\n' \
            "Sidebar Columns $TAG_VERSION is experimental and restores an unsupported native sidebar arrangement." \
            '' \
            'Read the README for compatibility limits, required layout backups and recovery instructions.' \
            'Before publication, download and verify all three assets against this run and verify their GitHub build attestations.' \
            'The installable ZIP, checksums and attestation bundle are retained with this Actions run, separate from the three Obsidian release assets.' \
            '' \
            "Build and developer artifacts: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG_VERSION" main.js manifest.json styles.css \
            --repo "$GH_REPO" --verify-tag --draft --prerelease=false --latest=false \
            --title "Sidebar Columns $TAG_VERSION (experimental)" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
